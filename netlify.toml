[build]
  command = 'npm ci && npm run build'
  publish = "public"

[build.environment]
  GO_VERSION = "1.26.3"
  HUGO_VERSION = "0.162.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "26.0.0"

[context.deploy-preview]
  command = 'npm ci && npm run build'

[context.branch-deploy]
  command = 'npm ci && npm run build'

[dev]
  command = 'npm run dev'
  port = 8888
  targetPort = 1313
  framework = "#custom"

[context.dev.environment]
  HUGO_ENV = "development"
