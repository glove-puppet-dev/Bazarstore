<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Title }}">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fb;
      }

      body {
        margin: 0;
      }

      a {
        color: inherit;
      }

      .site-header,
      .site-main,
      .site-footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 0;
      }

      .brand {
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
      }

      .hero {
        display: grid;
        gap: 20px;
        align-content: center;
        min-height: 56vh;
        padding: 48px 0;
      }

      .hero h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(40px, 7vw, 80px);
        line-height: 0.95;
      }

      .hero p {
        max-width: 620px;
        margin: 0;
        font-size: 20px;
        line-height: 1.55;
        color: #4b5568;
      }

      .site-footer {
        padding: 32px 0;
        color: #667085;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    </header>
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>&copy; {{ now.Year }} {{ site.Title }}</span>
    </footer>
  </body>
</html>
