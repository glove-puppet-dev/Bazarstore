<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Title }}">
    <meta name="theme-color" content="#b4b952">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        --brand: #b4b952;
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fb;
      }

      body {
        margin: 0;
      }

      a {
        color: inherit;
      }

      .site-header,
      .site-main,
      .site-footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        width: min(240px, 58vw);
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .hero {
        display: grid;
        gap: 16px;
        align-content: center;
        min-height: 38vh;
        padding: 40px 0 28px;
      }

      .hero h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1;
      }

      .hero p {
        max-width: 600px;
        margin: 0;
        font-size: 17px;
        line-height: 1.55;
        color: #4b5568;
      }

      .status-note {
        display: inline-flex;
        width: fit-content;
        border-left: 4px solid var(--brand);
        padding: 8px 12px;
        background: #eef0cc;
        color: #344054;
        font-weight: 600;
      }

      .overview-section {
        max-width: 860px;
        padding: 8px 0 28px;
      }

      .overview-section p {
        margin: 0 0 16px;
        font-size: 16px;
        line-height: 1.7;
        color: #344054;
      }

      .overview-section p:last-child {
        margin-bottom: 0;
      }

      .intro-section {
        max-width: 860px;
        padding: 0 0 32px;
      }

      .intro-section p {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
        color: #344054;
      }

      .partner-section {
        display: grid;
        grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1.3fr);
        gap: 28px;
        border-top: 1px solid #d9dcc0;
        border-bottom: 1px solid #d9dcc0;
        padding: 32px 0;
        margin-bottom: 28px;
      }

      .partner-section h2 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      .partner-section ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .partner-section li {
        position: relative;
        padding-left: 20px;
        font-size: 15px;
        line-height: 1.55;
        color: #344054;
      }

      .partner-section li::before {
        position: absolute;
        top: 0.68em;
        left: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--brand);
        content: "";
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        padding: 8px 0 56px;
      }

      .info-card {
        border-top: 4px solid var(--brand);
        padding-top: 18px;
      }

      .info-card h2 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.2;
      }

      .info-card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: #4b5568;
      }

      @media (max-width: 860px) {
        .info-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .partner-section {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .info-grid {
          grid-template-columns: 1fr;
        }
      }

      .site-footer {
        padding: 32px 0;
        color: #667085;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
        <img src="/images/bazarstore-biz-logo.svg" alt="{{ site.Title }}" width="2735" height="526">
      </a>
    </header>
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>&copy; {{ now.Year }} {{ site.Title }}</span>
    </footer>
  </body>
</html>
