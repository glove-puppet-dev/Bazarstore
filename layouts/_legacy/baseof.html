<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Title }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta name="theme-color" content="#b4b952">
    <link rel="preload" as="image" href="/images/bazarstore-hero.avif" type="image/avif">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        --brand: #b4b952;
        --ink: #172033;
        --muted: #4b5568;
        --line: #d9dcc0;
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #ffffff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      a {
        color: inherit;
      }

      .site-header,
      .site-footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-main {
        width: 100%;
      }

      .site-main > :not(.hero) {
        width: min(1120px, calc(100% - 32px));
        margin-right: auto;
        margin-left: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        width: min(240px, 58vw);
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .hero {
        position: relative;
        display: grid;
        align-items: center;
        width: 100%;
        min-height: min(640px, calc(100vh - 92px));
        padding: 64px max(16px, calc((100vw - 1120px) / 2));
        overflow: hidden;
        background-image:
          linear-gradient(90deg, rgba(10, 16, 28, 0.88) 0%, rgba(10, 16, 28, 0.72) 36%, rgba(10, 16, 28, 0.18) 72%),
          linear-gradient(0deg, rgba(10, 16, 28, 0.68) 0%, rgba(10, 16, 28, 0) 48%),
          url("/images/bazarstore-hero.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        color: #ffffff;
      }

      @supports (background-image: image-set(url("/images/bazarstore-hero.avif") type("image/avif"))) {
        .hero {
          background-image:
            linear-gradient(90deg, rgba(10, 16, 28, 0.88) 0%, rgba(10, 16, 28, 0.72) 36%, rgba(10, 16, 28, 0.18) 72%),
            linear-gradient(0deg, rgba(10, 16, 28, 0.68) 0%, rgba(10, 16, 28, 0) 48%),
            image-set(
              url("/images/bazarstore-hero.avif") type("image/avif"),
              url("/images/bazarstore-hero.webp") type("image/webp"),
              url("/images/bazarstore-hero.png") type("image/png")
            );
        }
      }

      .hero-content {
        display: grid;
        gap: 16px;
        max-width: 680px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(42px, 6vw, 74px);
        line-height: 0.96;
        letter-spacing: -0.02em;
      }

      .hero p {
        max-width: 600px;
        margin: 0;
        font-size: 18px;
        line-height: 1.55;
        color: #e8ecf4;
      }

      .eyebrow {
        margin: 0;
        color: var(--brand);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status-note {
        display: inline-flex;
        width: fit-content;
        border-left: 4px solid var(--brand);
        padding: 9px 13px;
        background: rgba(238, 240, 204, 0.15);
        color: #ffffff;
        font-weight: 600;
        backdrop-filter: blur(6px);
      }

      .overview-section {
        max-width: 860px;
        padding: 0 0 56px;
      }

      .overview-section p {
        margin: 0 0 16px;
        font-size: 16px;
        line-height: 1.7;
        color: #344054;
      }

      .overview-section p:last-child {
        margin-bottom: 0;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        padding: 48px 0 40px;
      }

      .metric-item {
        border-top: 4px solid var(--brand);
        padding-top: 16px;
      }

      .metric-item strong {
        display: block;
        margin-bottom: 8px;
        font-size: 30px;
        line-height: 1;
      }

      .metric-item span {
        display: block;
        font-size: 15px;
        line-height: 1.45;
        color: var(--muted);
      }

      .statement-section {
        max-width: 860px;
        padding: 0 0 56px;
      }

      .statement-section p {
        margin: 0;
        font-size: clamp(26px, 4vw, 44px);
        font-weight: 750;
        letter-spacing: -0.02em;
        line-height: 1.12;
        color: var(--ink);
      }

      .section-heading {
        max-width: 680px;
        margin-bottom: 26px;
      }

      .section-heading h2 {
        margin: 8px 0 0;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .story-section {
        padding: 0 0 48px;
      }

      .story-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px 36px;
      }

      .story-block {
        border-top: 4px solid var(--brand);
        padding-top: 18px;
      }

      .story-block h3 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.2;
      }

      .story-block p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
      }

      .route-section {
        display: grid;
        grid-template-columns: minmax(240px, 0.75fr) minmax(0, 1.25fr);
        gap: 32px;
        padding: 44px 0;
        border-top: 1px solid var(--line);
      }

      .route-section h2 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.1;
      }

      .route-section p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
      }

      .route-section ol {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: route;
      }

      .route-section li {
        counter-increment: route;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        font-size: 15px;
        line-height: 1.4;
        color: #344054;
      }

      .route-section li::before {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: #eef0cc;
        color: #172033;
        content: counter(route);
        font-weight: 700;
      }

      .partner-section {
        display: grid;
        grid-template-columns: minmax(440px, 0.9fr) minmax(0, 1.1fr);
        gap: 28px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 40px 0;
        margin-bottom: 44px;
      }

      .partner-section h2 {
        margin: 8px 0 0;
        font-size: clamp(24px, 2.5vw, 28px);
        line-height: 1.15;
        white-space: nowrap;
      }

      .partner-section ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .partner-section li {
        position: relative;
        padding-left: 20px;
        font-size: 15px;
        line-height: 1.55;
        color: #344054;
      }

      .partner-section li::before {
        position: absolute;
        top: 0.68em;
        left: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--brand);
        content: "";
      }

      .capability-section {
        display: grid;
        gap: 36px;
        padding: 0 0 56px;
      }

      .capability-group {
        display: grid;
        grid-template-columns: minmax(240px, 0.7fr) minmax(0, 1.3fr);
        gap: 32px;
        border-top: 1px solid var(--line);
        padding-top: 28px;
      }

      .capability-group-heading h2 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }

      .capability-group-heading p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
      }

      .capability-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 24px;
      }

      .capability-item {
        border-top: 4px solid var(--brand);
        padding-top: 16px;
      }

      .capability-item h3 {
        margin: 0 0 10px;
        font-size: 19px;
        line-height: 1.2;
      }

      .capability-item p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .metrics-grid,
        .route-section ol,
        .story-grid,
        .capability-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .route-section,
        .partner-section,
        .capability-group {
          grid-template-columns: 1fr;
        }

        .partner-section h2 {
          white-space: normal;
        }
      }

      @media (max-width: 560px) {
        .hero {
          min-height: 620px;
          padding-top: 64px;
          background-position: 58% center;
        }

        .metrics-grid,
        .route-section ol,
        .story-grid,
        .capability-list {
          grid-template-columns: 1fr;
        }
      }

      .site-footer {
        padding: 32px 0;
        color: #667085;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
        <img src="/images/bazarstore-biz-logo.svg" alt="{{ site.Title }}" width="2735" height="526">
      </a>
    </header>
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>&copy; {{ now.Year }} {{ site.Title }}</span>
    </footer>
  </body>
</html>
